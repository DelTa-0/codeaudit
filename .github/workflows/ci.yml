name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Blocking: typechecks @codeaudit/engine + server and builds the web app.
      - name: Build (engine + server + web)
        run: npm run build

      # Blocking: hermetic tests (no network — a pure constants check and a
      # local mock HTTP server, respectively).
      - name: Test — plan limits
        run: npm run test:plan-limits --workspace server

      - name: Test — LLM protocol
        run: npm run test:llm-protocol --workspace server

      # Non-blocking: these hit the live npm / PyPI registries, so registry
      # rate-limits or outages must not fail the build. They still surface
      # results in the log for signal.
      - name: Test — ground truth (JS, live npm registry)
        continue-on-error: true
        run: npm run test:ground-truth --workspace server

      - name: Test — ground truth (Python, live PyPI registry)
        continue-on-error: true
        run: npm run test:ground-truth-python --workspace server

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Guards the deployment path: the production image must keep building.
      - name: Build production image
        run: docker build -t codeorion:ci .

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    # The server's config.ts fail-fasts on missing env at import time, and the
    # test files transitively import it (plan-limits -> plans -> pool -> config).
    # These throwaway values only let config load — the tests never open a DB
    # connection or use a real secret (they read a constant / hit a mock server
    # or the live public registries).
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      JWT_SECRET: ci-not-a-real-secret
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Blocking: typechecks @codeaudit/engine + server and builds the web app.
      - name: Build (engine + server + web)
        run: npm run build

      # Blocking: hermetic tests (no network — a pure constants check and a
      # local mock HTTP server, respectively).
      - name: Test — plan limits
        run: npm run test:plan-limits --workspace server

      - name: Test — LLM protocol
        run: npm run test:llm-protocol --workspace server

      # Blocking, and the most important guard here: runs our own detectors
      # against this repository. A scan once reported five hardcoded secrets in
      # this repo and every one was a false positive — including the detector's
      # own source, where a comment quoting a PEM header was read as a leaked
      # key. Fixtures cannot catch that class: they hold realistic secrets, not
      # prose *about* secrets. Offline, ~2s.
      - name: Test — self scan (detector precision against this repo)
        run: npm run test:self-scan --workspace server

      # Blocking: offline. Agent/MCP inventory, PR comment rendering and its
      # markdown-forgery escaping, and dependency attribution (builds a throwaway
      # git repo — needs only git, which the runner has).
      - name: Test — agent surface
        run: npm run test:agent-surface --workspace server

      - name: Test — PR comment body
        run: npm run test:pr-comment --workspace server

      - name: Test — dependency attribution
        run: npm run test:dependency-attribution --workspace server

      # Schema first — the lifecycle suite exercises real tables.
      - name: Migrate the CI database
        run: npm run migrate
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci

      # Blocking: needs the postgres service. The behaviour under test is the
      # SQL itself — which rows a scan may change, and which it must leave
      # alone — so a mock would test nothing.
      - name: Test — finding lifecycle
        run: npm run test:finding-lifecycle --workspace server
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci

      - name: Test — phantom report intake
        run: npm run test:phantom-reports --workspace server
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci

      # Non-blocking like the other registry-backed suites: spawns the real
      # MCP server over stdio and several checks hit live npm/PyPI.
      - name: Build MCP server
        run: npm run build:mcp

      - name: Test — MCP ground truth (live registries)
        continue-on-error: true
        run: npm run test:ground-truth --workspace mcp

      # Non-blocking: these hit the live npm / PyPI registries, so registry
      # rate-limits or outages must not fail the build. They still surface
      # results in the log for signal.
      - name: Test — ground truth (JS, live npm registry)
        continue-on-error: true
        run: npm run test:ground-truth --workspace server

      - name: Test — ground truth (Python, live PyPI registry)
        continue-on-error: true
        run: npm run test:ground-truth-python --workspace server

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Guards the deployment path: the production image must keep building.
      - name: Build production image
        run: docker build -t codeorion:ci .
